name: test
on:
- pull_request
jobs:
  foundation-linking:
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@main
    permissions:
      contents: read
    with:
      excluded_products: 'APNSURLSession APNSTestServer'
  focal:
    container:
      image: swift:6.2-bookworm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - run: swift test
  no-service-lifecycle:
    container:
      image: swift:6.2-bookworm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - run: swift build --disable-default-traits
  thread:
    container:
      image: swift:6.2-bookworm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - run: swift test --sanitize=thread
  address:
    container:
      image: swift:6.2-bookworm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - run: ASAN_OPTIONS=detect_leaks=0 swift test --sanitize=address
